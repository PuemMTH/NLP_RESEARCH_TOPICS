<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Diagram</title>

  <!-- D3 + Sankey -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12/dist/d3-sankey.min.js"></script>
  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <!-- MathJax (LaTeX) -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.31.1.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f1117;
      --surface:     #1a1d2e;
      --border:      #2d3148;
      --text:        #e2e8f0;
      --text-muted:  #8892b0;
      --accent:      #64ffda;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem 4rem;
      gap: 1.5rem;
    }

    header {
      width: 100%;
      max-width: 1200px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    #diagram-container {
      width: 100%;
      max-width: 1200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      overflow: auto;
    }

    /* ── Sankey ─────────────────────────────────── */
    .sankey-link { opacity: 0.38; transition: opacity 0.2s; fill: none; }
    .sankey-link:hover { opacity: 0.72; }
    .sankey-label { font-size: 12px; fill: var(--text); font-weight: 500; }

    /* ── LaTeX ──────────────────────────────────── */
    .latex-block {
      margin: 1.2rem 0;
      padding: 1rem 1.5rem;
      background: var(--bg);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      font-size: 1.05rem;
      overflow-x: auto;
    }
    .latex-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    /* ── Mermaid ────────────────────────────────── */
    .mermaid { color: var(--text); }

    /* ── Tooltip ────────────────────────────────── */
    #tooltip {
      position: fixed;
      background: rgba(26,29,46,0.96);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 999;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <h1 id="graph-title">Diagram</h1>
  <p class="subtitle" id="graph-subtitle"></p>
</header>

<div id="diagram-container"></div>
<div id="tooltip"></div>

<script>
// ════════════════════════════════════════════════════════════════════════
// CONFIG — Claude replaces this block when generating a specific diagram
// ════════════════════════════════════════════════════════════════════════
const CONFIG = {
  type: "sankey",
  title: "NLP Research Scope Overview",
  subtitle: "Core areas → Tasks → Application domains (width = relative research volume)",
  data: {
    nodes: [
      { id: "NLP",       label: "NLP Research" },
      { id: "NLU",       label: "Natural Language Understanding" },
      { id: "NLG",       label: "Natural Language Generation" },
      { id: "IE",        label: "Information Extraction" },
      { id: "MM",        label: "Multimodal & Document AI" },
      { id: "MT",        label: "Machine Translation" },
      { id: "TC",        label: "Text Classification" },
      { id: "QA",        label: "Question Answering" },
      { id: "NER",       label: "NER & Sequence Labeling" },
      { id: "LLM",       label: "LLM & Text Generation" },
      { id: "SUM",       label: "Summarization" },
      { id: "DLG",       label: "Dialogue Systems" },
      { id: "RE",        label: "Relation Extraction" },
      { id: "ED",        label: "Event Detection" },
      { id: "KG",        label: "Knowledge Graph" },
      { id: "OCR",       label: "OCR & Document AI" },
      { id: "VLM",       label: "Vision-Language Models" },
      { id: "ASR",       label: "Speech & ASR" },
      { id: "NMT",       label: "Neural MT" },
      { id: "LRNLP",     label: "Low-resource & Thai NLP" },
      { id: "Health",    label: "Healthcare" },
      { id: "Education", label: "Education" },
      { id: "Legal",     label: "Legal" },
      { id: "Finance",   label: "Finance" },
      { id: "General",   label: "General Apps" },
      { id: "Code",      label: "Code & Dev Tools" }
    ],
    links: [
      { source: "NLP", target: "NLU",   value: 30 },
      { source: "NLP", target: "NLG",   value: 25 },
      { source: "NLP", target: "IE",    value: 15 },
      { source: "NLP", target: "MM",    value: 20 },
      { source: "NLP", target: "MT",    value: 10 },

      { source: "NLU", target: "TC",    value: 10 },
      { source: "NLU", target: "QA",    value: 10 },
      { source: "NLU", target: "NER",   value: 10 },

      { source: "NLG", target: "LLM",   value: 12 },
      { source: "NLG", target: "SUM",   value: 8  },
      { source: "NLG", target: "DLG",   value: 5  },

      { source: "IE",  target: "RE",    value: 6  },
      { source: "IE",  target: "ED",    value: 5  },
      { source: "IE",  target: "KG",    value: 4  },

      { source: "MM",  target: "OCR",   value: 9  },
      { source: "MM",  target: "VLM",   value: 7  },
      { source: "MM",  target: "ASR",   value: 4  },

      { source: "MT",  target: "NMT",   value: 6  },
      { source: "MT",  target: "LRNLP", value: 4  },

      { source: "TC",  target: "Health",  value: 3 },
      { source: "TC",  target: "Finance", value: 3 },
      { source: "TC",  target: "Legal",   value: 2 },
      { source: "TC",  target: "General", value: 2 },

      { source: "QA",  target: "Health",    value: 3 },
      { source: "QA",  target: "Education", value: 4 },
      { source: "QA",  target: "General",   value: 3 },

      { source: "NER", target: "Health",  value: 4 },
      { source: "NER", target: "Legal",   value: 3 },
      { source: "NER", target: "Finance", value: 3 },

      { source: "LLM", target: "General",   value: 5 },
      { source: "LLM", target: "Code",      value: 4 },
      { source: "LLM", target: "Education", value: 3 },

      { source: "SUM", target: "Health",  value: 3 },
      { source: "SUM", target: "Legal",   value: 3 },
      { source: "SUM", target: "General", value: 2 },

      { source: "DLG", target: "Health",  value: 2 },
      { source: "DLG", target: "General", value: 3 },

      { source: "RE",  target: "Health", value: 3 },
      { source: "RE",  target: "Legal",  value: 3 },

      { source: "ED",  target: "Finance", value: 3 },
      { source: "ED",  target: "General", value: 2 },

      { source: "KG",  target: "Health",  value: 2 },
      { source: "KG",  target: "General", value: 2 },

      { source: "OCR", target: "Health",  value: 5 },
      { source: "OCR", target: "Legal",   value: 2 },
      { source: "OCR", target: "Finance", value: 2 },

      { source: "VLM", target: "Health",  value: 3 },
      { source: "VLM", target: "General", value: 4 },

      { source: "ASR", target: "Education", value: 2 },
      { source: "ASR", target: "General",   value: 2 },

      { source: "NMT",   target: "General",   value: 4 },
      { source: "NMT",   target: "Education", value: 2 },

      { source: "LRNLP", target: "Health",    value: 2 },
      { source: "LRNLP", target: "Education", value: 2 }
    ]
  }
};
// ════════════════════════════════════════════════════════════════════════

const PALETTE = [
  "#4c9be8","#7c5cbf","#64ffda","#f97316","#a855f7",
  "#ec4899","#22d3ee","#84cc16","#fbbf24","#ef4444",
  "#10b981","#6366f1","#14b8a6","#f59e0b","#8b5cf6",
  "#3b82f6","#d946ef","#0ea5e9","#a3e635","#fb923c"
];

const container = document.getElementById("diagram-container");
const tooltip   = document.getElementById("tooltip");

document.getElementById("page-title").textContent  = CONFIG.title;
document.getElementById("graph-title").textContent = CONFIG.title;
document.getElementById("graph-subtitle").textContent = CONFIG.subtitle || "";

// ── Renderers ────────────────────────────────────────────────────────────────

function renderSankey(data) {
  const W = Math.min(container.clientWidth - 64, 1100);
  const H = Math.max(520, data.links.length * 20);
  const PAD = { top: 12, right: 200, bottom: 12, left: 200 };

  const svg = d3.select(container).append("svg")
    .attr("viewBox", `0 0 ${W} ${H}`)
    .attr("preserveAspectRatio", "xMidYMid meet");

  const sankey = d3.sankey()
    .nodeId(d => d.id)
    .nodeWidth(22)
    .nodePadding(16)
    .extent([[PAD.left, PAD.top], [W - PAD.right, H - PAD.bottom]]);

  const { nodes, links } = sankey({
    nodes: data.nodes.map(d => ({ ...d })),
    links: data.links.map(d => ({ ...d }))
  });

  const colorOf = {};
  nodes.forEach((n, i) => { colorOf[n.id] = PALETTE[i % PALETTE.length]; });

  // Links
  svg.append("g").selectAll("path")
    .data(links).join("path")
    .attr("class", "sankey-link")
    .attr("d", d3.sankeyLinkHorizontal())
    .attr("stroke", d => colorOf[d.source.id])
    .attr("stroke-width", d => Math.max(1.5, d.width))
    .on("mousemove", (e, d) => {
      tooltip.style.opacity = 1;
      tooltip.style.left = (e.clientX + 14) + "px";
      tooltip.style.top  = (e.clientY - 30) + "px";
      tooltip.textContent = `${d.source.label || d.source.id} → ${d.target.label || d.target.id}  ${d.value}`;
    })
    .on("mouseleave", () => { tooltip.style.opacity = 0; });

  // Nodes
  const nodeG = svg.append("g").selectAll("g")
    .data(nodes).join("g").attr("class", "sankey-node");

  nodeG.append("rect")
    .attr("x", d => d.x0).attr("y", d => d.y0)
    .attr("width",  d => d.x1 - d.x0)
    .attr("height", d => Math.max(5, d.y1 - d.y0))
    .attr("fill", d => colorOf[d.id])
    .attr("rx", 4);

  nodeG.append("text")
    .attr("class", "sankey-label")
    .attr("x", d => d.x0 < W / 2 ? d.x1 + 9 : d.x0 - 9)
    .attr("y", d => (d.y0 + d.y1) / 2)
    .attr("dy", "0.35em")
    .attr("text-anchor", d => d.x0 < W / 2 ? "start" : "end")
    .text(d => d.label || d.id);
}

function renderMermaid(data) {
  mermaid.initialize({ startOnLoad: false, theme: "dark" });
  const pre = document.createElement("pre");
  pre.className = "mermaid";
  pre.textContent = data.definition;
  container.appendChild(pre);
  mermaid.run({ nodes: [pre] });
}

function renderLatex(data) {
  data.blocks.forEach(block => {
    const wrap = document.createElement("div");
    wrap.className = "latex-block";
    if (block.label) {
      const lbl = document.createElement("div");
      lbl.className = "latex-label";
      lbl.textContent = block.label;
      wrap.appendChild(lbl);
    }
    const math = document.createElement("div");
    math.textContent = `\\[${block.tex || block}\\]`;
    wrap.appendChild(math);
    container.appendChild(wrap);
  });
}

function renderPlotly(data) {
  const div = document.createElement("div");
  container.appendChild(div);
  const layout = Object.assign({
    paper_bgcolor: "transparent",
    plot_bgcolor:  "transparent",
    font:   { color: "#e2e8f0", family: "Segoe UI, system-ui, sans-serif" },
    margin: { t: 30, b: 50, l: 60, r: 30 }
  }, data.layout || {});
  Plotly.newPlot(div, data.traces, layout, { responsive: true });
}

// ── Dispatch ─────────────────────────────────────────────────────────────────
const RENDERERS = { sankey: renderSankey, mermaid: renderMermaid, latex: renderLatex, plotly: renderPlotly };
const render = RENDERERS[CONFIG.type];
if (render) {
  render(CONFIG.data);
} else {
  container.innerHTML = `<p style="color:#ef4444">Unknown diagram type: <strong>${CONFIG.type}</strong><br>Valid types: sankey, mermaid, latex, plotly</p>`;
}
</script>
</body>
</html>
