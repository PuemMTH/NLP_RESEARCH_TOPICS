[project]
name = "easyocr-thai-poc"
version = "0.1.0"
description = "POC: EasyOCR Thai+English text recognition"
requires-python = ">=3.10"
dependencies = [
    "easyocr",
    "pillow",
    "torch",
    "torchvision",
]

# cu128 = CUDA 12.8 — supports sm_50 through sm_120 (Blackwell RTX 50xx)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
